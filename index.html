<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>Vườn hoa dành cho em 🌷 • 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================
       MOBILE-FIRST DESIGN SYSTEM (Default: Mobile Devices)
       ========================================================== */
    :root {
      color-scheme: dark;
      --pink-primary: #ff6ca3;
      --pink-soft: #ffb8d7;
      --pink-light: #fff0f6;
      --pink-dark: #b81b5c;
      --cream: #fff5ee;
      --gold: #ffe082;
      --night-deep: #080714;
      --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --grand-size: clamp(210px, 56vw, 260px);
      --grand-height: clamp(380px, 58vh, 460px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      font-family: var(--font-body);
      background-color: var(--night-deep);
      color: var(--cream);
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #251a42 0%, #120e28 50%, #080714 100%);
      position: relative;
    }

    /* Ambient stars & glowing moon */
    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #ffffff;
      animation: twinkle 2.2s infinite alternate ease-in-out;
    }

    .moon {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      top: max(16px, env(safe-area-inset-top));
      width: clamp(40px, 11vw, 56px);
      height: clamp(40px, 11vw, 56px);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffdf0 0%, #fff4c2 65%, #fae188 100%);
      box-shadow: 0 0 25px rgba(255, 244, 194, 0.65), 0 0 70px rgba(255, 230, 140, 0.3);
      z-index: 2;
    }

    /* Floating hearts */
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 3;
    }

    .heart {
      position: absolute;
      bottom: -30px;
      color: rgba(255, 140, 185, 0.7);
      text-shadow: 0 0 10px rgba(255, 110, 165, 0.8);
      animation: rise var(--duration) linear infinite;
      animation-delay: var(--hd);
    }

    /* Garden Scene at bottom */
    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 4;
    }

    .ground {
      position: absolute;
      bottom: -4%;
      width: 140%;
      left: -20%;
      height: 18%;
      border-radius: 50% 50% 0 0;
      background: linear-gradient(180deg, #184334 0%, #0a211d 60%, #040e0d 100%);
      box-shadow: 0 -8px 25px rgba(10, 33, 29, 0.5);
    }

    /* Small garden flower elements */
    .flower {
      position: absolute;
      bottom: 5%;
      left: var(--x);
      width: var(--size);
      height: var(--height);
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      animation: grow 0.75s cubic-bezier(.17, .7, .2, 1) forwards;
      animation-delay: var(--delay);
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 4px;
      height: 80%;
      border-radius: 100px;
      background: linear-gradient(90deg, #1e5c46, #60b87c, #194b39);
      transform: translateX(-50%) rotate(var(--lean));
      transform-origin: bottom center;
    }

    .leaf {
      position: absolute;
      bottom: 35%;
      left: 50%;
      width: 32%;
      height: 14%;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #42ad7d, #1e6648);
      transform: rotate(-35deg);
      transform-origin: left bottom;
    }

    .leaf.right {
      bottom: 48%;
      transform: translateX(-95%) scaleX(-1) rotate(-35deg);
    }

    .bloom {
      position: absolute;
      left: 50%;
      top: 2%;
      width: 100%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 10px var(--glow));
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40%;
      height: 58%;
      border-radius: 55% 55% 45% 45%;
      background: linear-gradient(145deg, #ffffff, var(--petal) 48%, var(--deep));
      transform-origin: 50% 90%;
      transform: translate(-50%, -88%) rotate(var(--rot)) scale(0.05);
      animation: open 0.65s cubic-bezier(.18, .75, .2, 1.2) forwards;
      animation-delay: calc(var(--delay) + 0.25s);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 26%;
      height: 26%;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      background: radial-gradient(circle, #fffbe6, #ffca36 60%, #c48216);
      box-shadow: 0 0 8px rgba(255, 218, 90, 0.85);
      animation: centerIn 0.3s cubic-bezier(.2, .9, .3, 1.2) forwards;
      animation-delay: calc(var(--delay) + 0.45s);
    }

    /* Screen Overlay: Intro */
    .intro {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(20px, 6vw, 36px);
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
      background: rgba(8, 7, 20, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 25;
      transition: opacity 0.35s ease, visibility 0.35s;
    }

    .intro.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .intro-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 30px;
      background: rgba(255, 108, 163, 0.15);
      border: 1px solid rgba(255, 156, 206, 0.35);
      color: var(--pink-soft);
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .intro h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.85rem, 7.5vw, 2.8rem);
      font-weight: 600;
      color: #fff0f6;
      line-height: 1.25;
      margin-bottom: 24px;
      text-shadow: 0 0 25px rgba(255, 156, 206, 0.5);
    }

    .btn {
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.45);
      background: linear-gradient(135deg, #ff6fa7 0%, #d83478 60%, #a41c53 100%);
      color: #ffffff;
      border-radius: 100px;
      padding: 15px 34px;
      font-weight: 700;
      font-size: 1.05rem;
      font-family: var(--font-body);
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(235, 60, 130, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.5);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: pulse-btn 2.2s infinite ease-in-out;
    }

    @keyframes pulse-btn {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 8px 30px rgba(235, 60, 130, 0.5);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 12px 36px rgba(255, 108, 163, 0.75);
      }
    }

    .btn:active {
      transform: scale(0.96) !important;
      box-shadow: 0 4px 18px rgba(235, 60, 130, 0.4);
    }

    /* ==========================================================
       THE GRAND CENTERPIECE FLOWER: EXACT STRUCTURE OF THE GARDEN FLOWERS
       ========================================================== */
    .flower.grand {
      position: absolute;
      bottom: 5%;
      left: 50%;
      width: var(--grand-size);
      height: var(--grand-height);
      transform: translateX(-50%) scale(0);
      transform-origin: bottom center;
      z-index: 60;
      pointer-events: none;
      display: none;
      --petal: #ff9ec4;
      --deep: #d83b84;
      --glow: #ff78b0;
    }

    .flower.grand.active {
      display: block;
      animation: grow 0.75s cubic-bezier(.17, .7, .2, 1) forwards;
      animation-delay: var(--delay, 0.1s);
    }

    .flower.grand .stem {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: clamp(8px, 2vw, 11px);
      height: calc(100% - (var(--grand-size) * 0.45));
      border-radius: 100px;
      background: linear-gradient(90deg, #184e34, #3bb16e 45%, #184e34);
      box-shadow: 0 0 12px rgba(45, 170, 95, 0.45);
      transform: translateX(-50%);
      transform-origin: bottom center;
    }

    /* Leaves: 1 Left, 1 Right - anchored firmly to stem well below the bloom */
    .flower.grand .leaf {
      position: absolute;
      width: clamp(45px, 13vw, 58px);
      height: clamp(20px, 5.5vw, 26px);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      z-index: 5;
    }

    /* Upper left leaf */
    .flower.grand .leaf.left {
      right: 50%;
      left: auto;
      bottom: 36%;
      border-radius: 0 100% 0 100%;
      background: linear-gradient(225deg, #6ee7b7, #22c55e 40%, #15803d);
      transform-origin: right bottom;
      transform: rotate(32deg);
    }

    /* Lower right leaf */
    .flower.grand .leaf.right {
      left: 50%;
      bottom: 22%;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #6ee7b7, #22c55e 40%, #15803d);
      transform-origin: left bottom;
      transform: rotate(-32deg);
    }

    .flower.grand .bloom {
      position: absolute;
      left: 50%;
      top: 0;
      width: 100%;
      aspect-ratio: 1;
      transform: translateX(-50%);
      filter: drop-shadow(0 0 25px var(--glow));
    }

    /* Exactly 8 petals blooming simultaneously like small flowers */
    .flower.grand .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40%;
      height: 58%;
      border-radius: 55% 55% 45% 45%;
      background: linear-gradient(145deg, #ffffff 5%, var(--petal) 48%, var(--deep) 95%);
      box-shadow: 0 4px 14px rgba(136, 19, 55, 0.25);
      transform-origin: 50% 90%;
      transform: translate(-50%, -88%) rotate(var(--rot)) scale(0.05);
      animation: open 0.65s cubic-bezier(.18, .75, .2, 1.2) forwards;
      animation-delay: calc(var(--delay, 0.1s) + 0.25s);
    }

    /* Centerpiece Portrait: zooms in smoothly like the small flower center */
    .flower.grand .portrait {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42%;
      height: 42%;
      transform: translate(-50%, -50%) scale(0);
      border-radius: 50%;
      padding: 3.5px;
      background: linear-gradient(135deg, #ffe082 0%, #ff80bf 50%, #ffd54f 100%);
      box-shadow: 0 0 20px rgba(255, 230, 150, 0.9), 0 0 45px rgba(255, 105, 180, 0.75);
      overflow: hidden;
      z-index: 10;
      animation: centerIn 0.35s cubic-bezier(.2, .9, .3, 1.2) forwards;
      animation-delay: calc(var(--delay, 0.1s) + 0.45s);
    }

    .flower.grand .portrait img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #2a1533;
      display: block;
    }

    /* ==========================================================
       GREETING CARD OVERLAY (Slides in with graceful delay)
       ========================================================== */
    .card-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 14px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      z-index: 80;
      pointer-events: none;
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.6s, opacity 0.6s;
    }

    .card-overlay.show {
      visibility: visible;
      opacity: 1;
    }

    .card {
      width: 100%;
      max-width: min(92vw, 410px);
      background: rgba(14, 13, 30, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 175, 215, 0.28);
      border-radius: 20px;
      padding: 13px 18px 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 108, 163, 0.18);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      pointer-events: auto;
      transform: translateY(35px);
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s ease;
    }

    .card-overlay.show .card {
      transform: translateY(0);
      opacity: 1;
    }

    .card h2 {
      font-family: var(--font-serif);
      font-size: clamp(1.35rem, 5.2vw, 1.85rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ffffff 0%, #ffc6e0 50%, #ffa3cc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      line-height: 1.25;
      text-shadow: 0 0 20px rgba(255, 130, 185, 0.3);
    }

    .card p {
      font-size: clamp(0.82rem, 3.4vw, 0.94rem);
      line-height: 1.55;
      color: #fae5ef;
      margin: 2px 0 8px;
    }

    .card .btn-again {
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: linear-gradient(135deg, #ff7db3, #cf3c7f);
      color: white;
      border-radius: 100px;
      padding: 9px 22px;
      font-weight: 600;
      font-size: 0.88rem;
      font-family: var(--font-body);
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(220, 50, 120, 0.4);
      transition: transform 0.2s ease;
    }

    .card .btn-again:active {
      transform: scale(0.95);
    }

    /* Keyframe Animations */
    @keyframes grow {
      from { transform: translateX(-50%) scale(0); }
      to { transform: translateX(-50%) scale(1); }
    }

    @keyframes open {
      to { transform: translate(-50%, -88%) rotate(var(--rot)) scale(1); }
    }

    @keyframes centerIn {
      to { transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes rise {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      15% { opacity: 0.8; }
      85% { opacity: 0.8; }
      100% { transform: translateY(-110vh) rotate(35deg); opacity: 0; }
    }

    /* Tablet & Desktop */
    @media (min-width: 640px) {
      :root {
        --grand-size: clamp(230px, 38vmin, 290px);
        --grand-height: clamp(440px, 62vh, 540px);
      }
      .flower.grand .stem {
        width: 12px;
      }
      .flower.grand .leaf {
        width: 68px;
        height: 32px;
      }
      .card {
        padding: 18px 24px 20px;
        border-radius: 24px;
        gap: 8px;
        max-width: 440px;
      }
      .card h2 { font-size: 2rem; }
      .card p { font-size: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .star, .heart { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Ambient Stars & Moon -->
  <div class="stars" id="stars"></div>
  <div class="moon"></div>
  <div class="hearts" id="hearts"></div>

  <!-- Garden Background -->
  <div class="scene" id="scene">
    <div class="ground"></div>
  </div>

  <!-- Background Music (Auto-play when entering web) -->
  <audio id="bgMusic" src="assets/Phép Màu (Đàn cá gỗ OST) - MAYDAYs ft. Minh Tốc Offical MV.mp3" autoplay preload="auto" loop playsinline></audio>

  <!-- Step 1: Romantic Intro Screen -->
  <div class="intro" id="intro">
    <button class="btn" id="start">Ấn vào đây 💖</button>
  </div>

  <!-- Step 2: The Grand Centerpiece Flower (Same architecture as garden flowers) -->
  <div class="flower grand" id="grandFlower"></div>

  <!-- Step 3: Romantic Greeting Card Overlay (Slides in after flower blooms) -->
  <div class="card-overlay" id="cardOverlay">
    <div class="card">
      <h2>Chúc mừng 20/10, em yêu! 💕</h2>
      <p id="message">Giữa cả một vườn hoa rực rỡ ngát hương, em vẫn luôn là bông hoa xinh đẹp và đặc biệt nhất trong lòng anh. Cảm ơn em vì đã đến bên anh. Yêu em thật nhiều! ❤️</p>
      <button class="btn-again" id="again">Ngắm hoa nở lần nữa 🌸</button>
    </div>
  </div>

  <script>
    const scene = document.getElementById('scene');
    const stars = document.getElementById('stars');
    const hearts = document.getElementById('hearts');
    const grandFlower = document.getElementById('grandFlower');
    const cardOverlay = document.getElementById('cardOverlay');
    const intro = document.getElementById('intro');

    const bgMusic = document.getElementById('bgMusic');
    let started = false;

    const rand = (min, max) => Math.random() * (max - min) + min;

    // Ambient stars
    for (let i = 0; i < 75; i++) {
      const s = document.createElement('i');
      s.className = 'star';
      s.style.left = rand(0, 100) + '%';
      s.style.top = rand(0, 75) + '%';
      s.style.animationDelay = rand(0, 2.5) + 's';
      stars.append(s);
    }

    // Flower palette
    const colors = [
      ['#ff9ec4', '#d83b84', '#ff78b0'],
      ['#e0baff', '#9458d6', '#be89ff'],
      ['#ffe68f', '#e5923c', '#ffd766'],
      ['#ffb299', '#db5750', '#ff997a'],
      ['#ffd6ea', '#db7cae', '#ffb3d7']
    ];

    // Garden flowers planting
    function plant() {
      scene.querySelectorAll('.flower:not(.grand)').forEach(f => f.remove());
      const isMobile = window.innerWidth < 640;
      const count = isMobile ? 22 : 36;

      for (let i = 0; i < count; i++) {
        const f = document.createElement('div');
        const c = colors[i % colors.length];
        const x = rand(3, 97);
        const h = rand(isMobile ? 65 : 100, isMobile ? 140 : 230);
        const size = rand(isMobile ? 36 : 52, isMobile ? 60 : 90);
        const delay = rand(0, 0.35);

        f.className = 'flower';
        f.style.cssText = `--x:${x}%;--height:${h}px;--size:${size}px;--delay:${delay.toFixed(2)}s;--petal:${c[0]};--deep:${c[1]};--glow:${c[2]};--lean:${rand(-12, 12)}deg;z-index:${Math.round(10 + h)};`;
        f.innerHTML = '<div class="stem"></div><div class="leaf"></div><div class="leaf right"></div><div class="bloom"></div>';

        const bloom = f.querySelector('.bloom');
        for (let p = 0; p < 8; p++) {
          const petal = document.createElement('span');
          petal.className = 'petal';
          petal.style.setProperty('--rot', (p * 45) + 'deg');
          bloom.append(petal);
        }
        const center = document.createElement('span');
        center.className = 'center';
        bloom.append(center);

        scene.append(f);
      }
    }

    // Build & bloom Grand Centerpiece Flower with identical natural architecture as garden flowers
    function plantGrandFlower() {
      grandFlower.replaceChildren();
      grandFlower.style.setProperty('--delay', '0.08s');
      grandFlower.style.setProperty('--petal', '#ff9ec4');
      grandFlower.style.setProperty('--deep', '#d83b84');
      grandFlower.style.setProperty('--glow', '#ff78b0');

      const stem = document.createElement('div');
      stem.className = 'stem';

      const leafLeft = document.createElement('div');
      leafLeft.className = 'leaf left';

      const leafRight = document.createElement('div');
      leafRight.className = 'leaf right';

      const bloom = document.createElement('div');
      bloom.className = 'bloom';

      // 8 radial petals blooming outward like the garden flowers
      for (let p = 0; p < 8; p++) {
        const petal = document.createElement('span');
        petal.className = 'petal';
        petal.style.setProperty('--rot', (p * 45) + 'deg');
        bloom.append(petal);
      }

      // Centerpiece girlfriend portrait zooming in smoothly like the small flower center
      const portrait = document.createElement('div');
      portrait.className = 'portrait';
      const img = document.createElement('img');
      img.id = 'photo';
      img.src = 'assets/nguoi-yeu.jpg';
      img.alt = 'Ảnh người anh yêu';
      img.onerror = function() {
        this.onerror = null;
        this.src = 'assets/placeholder.svg';
      };
      portrait.append(img);
      bloom.append(portrait);

      grandFlower.append(stem, leafLeft, leafRight, bloom);

      // Trigger animation cleanly
      grandFlower.classList.remove('active');
      void grandFlower.offsetWidth;
      grandFlower.classList.add('active');
    }

    // Floating hearts
    function heartsUp() {
      hearts.replaceChildren();
      for (let i = 0; i < 22; i++) {
        const e = document.createElement('span');
        e.className = 'heart';
        e.textContent = ['♥', '♡', '✦'][i % 3];
        e.style.cssText = `left:${rand(0, 100)}%;font-size:${rand(12, 24)}px;--duration:${rand(4.5, 8.5)}s;--hd:${rand(-8, 0)}s;`;
        hearts.append(e);
      }
    }

    let cardTimer = null;

    // CHOREOGRAPHED ELEGANT SEQUENCE
    function start() {
      if (started) return;
      started = true;

      clearTimeout(cardTimer);

      // 1. Instantly hide intro
      intro.classList.add('hide');

      // Reset animation classes
      cardOverlay.classList.remove('show');

      // 2. Garden flowers sprout across the ground & Grand Centerpiece Flower blooms
      plant();
      plantGrandFlower();
      heartsUp();

      // 3. Popup greeting card delayed to 2.0s
      cardTimer = setTimeout(() => {
        cardOverlay.classList.add('show');
      }, 2000);

      playMusic();
    }

    function playMusic() {
      if (bgMusic && bgMusic.paused) {
        const p = bgMusic.play();
        if (p !== undefined) {
          p.catch(() => {});
        }
      }
    }

    document.getElementById('start').onclick = () => {
      playMusic();
      start();
    };

    document.getElementById('again').onclick = () => {
      started = false;
      cardOverlay.classList.remove('show');
      start();
    };

    // Tự động phát ngay khi vừa vào web
    playMusic();
    document.addEventListener('DOMContentLoaded', playMusic);
    window.addEventListener('load', playMusic);

    // Dự phòng: phát ngay khi chạm/ấn bất kỳ đâu nếu trình duyệt hạn chế autoplay âm thanh
    ['click', 'touchstart', 'touchend', 'pointerdown', 'keydown'].forEach(evt => {
      document.addEventListener(evt, playMusic, { once: true, passive: true });
    });
  </script>
</body>
</html>
